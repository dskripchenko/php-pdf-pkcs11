name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, zlib, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  gost:
    runs-on: ubuntu-latest
    name: GOST R 34.10-2012 (OpenSSL gost engine, emulated token)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the PHP + gost engine image
        uses: docker/build-push-action@v6
        with:
          context: docker/gost
          tags: php-pdf-pkcs11-gost
          load: true
          cache-from: type=gha,scope=php-pdf-pkcs11-gost
          cache-to: type=gha,scope=php-pdf-pkcs11-gost,mode=max

      - name: Run the tests with the engine loaded
        run: |
          docker run --rm -v "$PWD:/app" -w /app php-pdf-pkcs11-gost sh -c '
            composer update --prefer-dist --no-interaction --no-progress &&
            vendor/bin/phpunit --display-skipped --fail-on-skipped'

  static-analysis:
    runs-on: ubuntu-latest
    name: PHPStan (level 6)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, zlib, openssl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run PHPStan
        run: composer stan

  softhsm:
    runs-on: ubuntu-latest
    name: SoftHSM2 (php-pkcs11, RSA + ECDSA)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image (PHP 8.3, php-pkcs11, SoftHSM2)
        run: docker build -t php-pdf-pkcs11 docker

      - name: Sign and validate PDFs on a SoftHSM2 token
        run: docker run --rm -v "$PWD":/app php-pdf-pkcs11 bash docker/smoke/run.sh
